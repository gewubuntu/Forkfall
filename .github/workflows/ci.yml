name: CI
on:
  push:
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4          # version comes from "packageManager" (pnpm 12)
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }   # Node 26
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck                  # TypeScript 7
      - run: pnpm lint                       # oxlint (.oxlintrc.json)
      - run: pnpm test
      - run: pnpm sim 200
      - run: pnpm web:build

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a hung browser install or server fails fast instead of holding the runner for hours
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:build
      # The Chromium matching the pinned @playwright/test. No --with-deps: the runner image already has Chrome's
      # system libraries, and installing them through apt hung this job.
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e                                        # apps/web/e2e against an off-chain referee
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            apps/web/test-results

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.8.3 }
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vv
      # SDK ABIs against the contracts just built (packages/sdk/test/abi-sync.test.ts).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm test:abi
        working-directory: .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f deploy/Dockerfile -t forkfall-referee .
      - name: Smoke test (off-chain mode)
        run: |
          # Empty values, as an unfilled deploy/.env passes them: must fall back to defaults, not crash.
          docker run -d --name ff -e OFFCHAIN=1 -e CHAIN_ID=84532 -e HOUSE_PRIVATE_KEY= -e RPC_URL= -e TURN_SECONDS= -p 8787:8787 forkfall-referee
          for i in $(seq 60); do curl -fs localhost:8787/v1/config >/dev/null && break; sleep 1; done
          curl -fs localhost:8787/v1/config | grep -q '"chainId":84532'
          curl -fs localhost:8787/ | grep -qi '<html'
          docker stop -t 15 ff
          docker logs ff 2>&1 | tee /dev/stderr | grep -q 'SIGTERM: finishing requests in flight'
          test "$(docker inspect -f '{{.State.ExitCode}}' ff)" = 0   # exited by itself, not killed
